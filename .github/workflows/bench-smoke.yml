# Public-benchmark smoke on the platform the benchmarks publish for (linux/amd64).
# One Terminal-Bench task and one SWE-bench Verified task are fetched the way a user
# fetches them, and checked the way a run checks them: the task's own tests must fail
# on the untouched image and pass after its reference solution, inside the image.
# No model call is made and no API key is needed; Docker and Node are.
name: bench-smoke
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README*.md', 'THIRD_PARTY.md']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'   # weekly: the network-dependent task below
jobs:
  bench-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      # lib/ is committed (the package works as a dsh plugin from it); the plugin entry needs the dsh packages'
      # types, which only a machine with a dsh checkout has, so CI type-checks everything else and runs lib/.
      - run: npx tsc -p tsconfig.ci.json
      - run: npx vitest run
      - name: platform
        run: |
          uname -m && docker version --format '{{.Server.Version}} {{.Server.Os}}/{{.Server.Arch}}' && python3 --version && uv --version
      - name: Terminal-Bench 2.0 · index, get one task, check it inside its image
        run: |
          node lib/cli.js bench list terminal-bench | head -5
          node lib/cli.js bench get terminal-bench fix-git
          node lib/cli.js selfcheck fix-git
      - name: SWE-bench Verified · get one task (grading env, image), check it with the official harness
        # A task whose tests run offline: a smoke must not depend on a third party's website (requests' suite calls
        # httpbin.org and hung the grader for the full verifier timeout on this runner). The cap bounds any hang.
        run: |
          node lib/cli.js bench get swebench-verified django__django-13406
          node lib/cli.js selfcheck django__django-13406 --verifier-timeout 900
      - name: keep what the checks left behind
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-smoke
          if-no-files-found: ignore
          path: |
            .dsh-eval/bench/*/index.json
            bench/public/*/*/meta.json

  # A task whose tests reach a third party's website (requests' suite calls httpbin.org): it passes on a clean
  # network but takes half an hour, so it runs on demand and weekly rather than on every push.
  network-task:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - name: SWE-bench Verified · psf__requests-2317, whose tests need httpbin.org
        run: |
          node lib/cli.js bench get swebench-verified psf__requests-2317
          node lib/cli.js selfcheck psf__requests-2317 --verifier-timeout 1800
