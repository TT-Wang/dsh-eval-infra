# Two jobs worth copying into your own repository.
#
# 1. `ab`: gate a dsh plugin PR on a paired A/B against stock dsh. Needs a runner where `dsh` is
#    installed and DEEPSEEK_API_KEY is a secret.
# 2. `bench-smoke`: this repository's own job, .github/workflows/bench-smoke.yml — on a plain
#    ubuntu-latest (amd64) runner it fetches one Terminal-Bench task and one SWE-bench Verified task
#    and checks them inside their images. No API key, no dsh checkout: grading needs neither.
name: dsh-eval
on:
  pull_request:
jobs:
  ab:
    runs-on: self-hosted
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - run: npx dsh-eval init --plugin .
      - run: npx dsh-eval selfcheck --strict
      - run: npx dsh-eval diff baseline candidate
      # exit 0 = no regressions, 1 = regressions or a safety-gate violation, 2 = incomplete/cancelled; the cost cap keeps a runaway PR cheap
      - run: npx dsh-eval run --baseline baseline --arm candidate --repeats 3 --max-usd 5 --label "pr-${{ github.event.number }}"
      - if: always()
        run: npx dsh-eval export "$(ls .dsh-eval/runs | tail -1)" --html report.html
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-eval-report
          path: |
            report.html
            .dsh-eval/runs/*/report.md
            .dsh-eval/runs/*/report.json
